name: iOS simulator build
on:
  push:
    branches: [main, work/original-3d-scene-batch]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:
# Keep one active iPhone simulator verification per PR or branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Print selected Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Parse Swift sources before generating project
        run: swiftc -frontend -parse ios/*.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Inspect generated schemes
        run: xcodebuild -list -project CrazyMachinesIOS.xcodeproj
      - name: Build for iOS Simulator without signing
        run: |
          set -o pipefail
          mkdir -p /tmp/crazy-machines-build-logs
          xcodebuild -project CrazyMachinesIOS.xcodeproj -scheme CrazyMachinesIOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/crazy-machines-derived CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/crazy-machines-build-logs/xcodebuild.log
      - name: Choose iPhone destination without preboot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/work/original-3d-scene-batch'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # The hosted runner repeatedly left BOTH simctl bootstatus calls
          # waiting for 130 seconds; none of the actual UI tests ran.
          # Select a real device once, and let xcodebuild test boot it.
          export CM_SIMULATOR_PREFERRED_NAME="iPhone 17 Pro"
          DEVICE_ID="$(python3 tools/boot_iphone_simulator_ci.py --select-only)"
          test -n "$DEVICE_ID"
          echo "Selected Xcode-managed iPhone Simulator: $DEVICE_ID"
      - name: Run gameplay and navigation UI tests with Xcode-managed startup
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/work/original-3d-scene-batch'
        timeout-minutes: 22
        run: |
          set -o pipefail
          mkdir -p /tmp/crazy-machines-build-logs
          DEVICE_ID="$CM_SELECTED_IPHONE_UDID"
          test -n "$DEVICE_ID"
          # This test invocation is responsible for starting the iPhone.
          # It avoids the separate, flaky preboot/bootstatus bottleneck.
          xcodebuild -project CrazyMachinesIOS.xcodeproj -scheme CrazyMachinesIOS -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -destination-timeout 180 -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath /tmp/crazy-machines-derived -resultBundlePath /tmp/CrazyMachinesUITests.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee /tmp/crazy-machines-build-logs/ui-tests.log
      - name: Capture optional actual simulator launch screenshot
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/work/original-3d-scene-batch')
        timeout-minutes: 3
        run: |
          mkdir -p /tmp/crazy-machines-screenshots
          # XCT attachments are authoritative in-app screenshot proof.
          # This extra home/launch screenshot must never prevent UI tests
          # from being reported if CoreSimulator is slow after XCTest exits.
          python3 - <<'PY'
          import os
          import time
          from tools.boot_iphone_simulator_ci import SimulatorBootError, execute
          udid = os.environ["CM_SELECTED_IPHONE_UDID"]
          bundle_id = "org.crazymachines.port"
          try:
              execute(["xcrun", "simctl", "launch", "--terminate-running-process",
                       udid, bundle_id], timeout=35)
              time.sleep(4)
              execute(["xcrun", "simctl", "io", udid, "screenshot",
                       "/tmp/crazy-machines-screenshots/iphone-launch.png"],
                      timeout=35)
          except SimulatorBootError as exc:
              print("Optional launch screenshot not captured: " + str(exc))
          PY
      - name: Export UI test screenshots for direct inspection
        if: always()
        run: |
          if [ -d /tmp/CrazyMachinesUITests.xcresult ]; then
            mkdir -p /tmp/crazy-machines-ui-screenshots
            xcrun xcresulttool export attachments --path /tmp/CrazyMachinesUITests.xcresult --output-path /tmp/crazy-machines-ui-screenshots || true
          fi
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-ui-screenshots
          path: /tmp/crazy-machines-ui-screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-xcodebuild-log
          path: /tmp/crazy-machines-build-logs/*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload real iPhone simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-iphone-launch-screenshot
          path: /tmp/crazy-machines-screenshots/iphone-launch.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-ui-test-results
          path: /tmp/CrazyMachinesUITests.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator app for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-simulator
          path: /tmp/crazy-machines-derived/Build/Products/Debug-iphonesimulator/CrazyMachinesIOS.app
          if-no-files-found: warn
          retention-days: 7
