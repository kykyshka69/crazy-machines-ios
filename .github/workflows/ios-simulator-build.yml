name: iOS simulator build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print selected Xcode and SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Parse Swift sources before generating project
        run: swiftc -frontend -parse ios/*.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Inspect generated schemes
        run: xcodebuild -list -project CrazyMachinesIOS.xcodeproj
      - name: Build for iOS Simulator without signing
        run: |
          set -o pipefail
          mkdir -p /tmp/crazy-machines-build-logs
          xcodebuild -project CrazyMachinesIOS.xcodeproj -scheme CrazyMachinesIOS -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/crazy-machines-derived CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/crazy-machines-build-logs/xcodebuild.log
      - name: Boot iPhone simulator and capture actual launch screen
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for group in d.values() for x in group if x["name"].startswith("iPhone") and x["state"]=="Shutdown"), ""))')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP="/tmp/crazy-machines-derived/Build/Products/Debug-iphonesimulator/CrazyMachinesIOS.app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist" > /tmp/cm-bundle-id
          BUNDLE_ID=$(cat /tmp/cm-bundle-id)
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" "$BUNDLE_ID"
          sleep 8
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -F "$BUNDLE_ID" || echo "App launch command succeeded; process not found in launchctl list"
          mkdir -p /tmp/crazy-machines-screenshots
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/crazy-machines-screenshots/iphone-launch.png
      - name: Run launch and navigation UI tests on the booted iPhone
        run: |
          DEVICE_ID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for group in d.values() for x in group if x["name"].startswith("iPhone")))')
          xcodebuild -project CrazyMachinesIOS.xcodeproj -scheme CrazyMachinesIOS -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath /tmp/crazy-machines-derived -resultBundlePath /tmp/CrazyMachinesUITests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Upload Xcode build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-xcodebuild-log
          path: /tmp/crazy-machines-build-logs/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload real iPhone simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-iphone-launch-screenshot
          path: /tmp/crazy-machines-screenshots/iphone-launch.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-ui-test-results
          path: /tmp/CrazyMachinesUITests.xcresult
          if-no-files-found: warn
          retention-days: 7
      - name: Upload simulator app for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-simulator
          path: /tmp/crazy-machines-derived/Build/Products/Debug-iphonesimulator/CrazyMachinesIOS.app
          if-no-files-found: error
          retention-days: 7
