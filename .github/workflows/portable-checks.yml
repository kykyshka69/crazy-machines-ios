name: Portable checks

on:
  push:
    branches: [main, work/original-3d-scene-batch]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR commits do not need duplicate portable test runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Run portable checks
        run: bash scripts/run-local-checks.sh
