name: Source checks

on:
  push:
    branches: [main, work/original-3d-scene-batch]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# Cancel obsolete runs as soon as the PR receives a newer commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Source checks run ONLY Linux tests. Avoid three redundant macOS jobs:
# iOS build, real iPhone UI navigation and Swift syntax parsing already run
# together in ios-simulator-build.yml on the same PR SHA.
jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test material bridge without copyrighted game assets
        run: |
          cd tools
          python -m unittest -v test_shader_parser.py
          python -m unittest -v test_material_bridge.py
          python -m unittest -v test_stage_local_preview.py
          python -m unittest -v test_inspect_cml.py
          python -m unittest -v test_cml_candidate_spans.py
          python -m unittest -v test_cml_byte_transforms.py
          python -m unittest -v test_cml_puzzle_instructions.py
          python -m unittest -v test_analyze_puzzle_binary.py
          python -m unittest -v test_original_cml_frames.py
          python -m unittest -v test_inspect_puzzle_section_windows.py
          python -m unittest -v test_classify_puzzle_prefixes.py
          python -m unittest -v test_decompress_original_level.py
          python -m unittest -v test_export_original_scene_json.py
          python -m unittest -v test_parse_original_scene.py
          python -m unittest -v test_audit_original_model_coverage.py
          python -m unittest -v test_inventory_original_object_fields.py
          python -m unittest -v test_inspect_original_level_objects.py
          python -m unittest -v test_select_first_level_screenshot.py
          python -m unittest -v test_export_private_102_report.py
          python -m unittest -v test_boot_iphone_simulator_ci.py

  original-ucm-integrity-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original UCM geometry readiness with synthetic files
        run: |
          swiftc ios/CMOriginalSceneDocument.swift ios/CMOriginalModelResolver.swift ios/CMUCMModel.swift ios/CMTGATexture.swift ios/CMOriginalEffectBillboard.swift ios/CMOriginalAssetAudit.swift tests/OriginalAssetAuditSmoke.swift -o /tmp/cm-original-asset-audit
          /tmp/cm-original-asset-audit

  original-cml-metadata-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native original CML metadata probe
        run: |
          swiftc ios/CMOriginalCMLProbe.swift tests/CMOriginalCMLProbeSmoke.swift -o /tmp/cm-cml-probe
          /tmp/cm-cml-probe

  portable-swift-runtime:
