name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test material bridge without copyrighted game assets
        run: |
          cd tools
          python -m unittest -v test_shader_parser.py
          python -m unittest -v test_material_bridge.py
          python -m unittest -v test_stage_local_preview.py
          python -m unittest -v test_inspect_cml.py
          python -m unittest -v test_cml_candidate_spans.py
          python -m unittest -v test_cml_byte_transforms.py
          python -m unittest -v test_cml_puzzle_instructions.py
          python -m unittest -v test_analyze_puzzle_binary.py
          python -m unittest -v test_original_cml_frames.py
          python -m unittest -v test_inspect_puzzle_section_windows.py
          python -m unittest -v test_classify_puzzle_prefixes.py
          python -m unittest -v test_decompress_original_level.py
          python -m unittest -v test_export_original_scene_json.py
          python -m unittest -v test_parse_original_scene.py

  original-cml-metadata-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native original CML metadata probe
        run: |
          swiftc ios/CMOriginalCMLProbe.swift tests/CMOriginalCMLProbeSmoke.swift -o /tmp/cm-cml-probe
          /tmp/cm-cml-probe

  portable-swift-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run real Swift decoder/catalog tests
        run: |
          swiftc ios/CMTGATexture.swift ios/CMAttachmentCatalog.swift tests/PortableSmoke.swift -o /tmp/cm-portable-smoke
          /tmp/cm-portable-smoke

  tga-orientation-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test all TGA image origins
        run: |
          swiftc ios/CMTGATexture.swift tests/TGAOrientationSmoke.swift -o /tmp/cm-tga-orientation
          /tmp/cm-tga-orientation

  tga-thousand-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run 1000 deterministic TGA cases
        run: |
          swiftc ios/CMTGATexture.swift tests/TGAThousandSmoke.swift -o /tmp/cm-tga-thousand
          /tmp/cm-tga-thousand

  ucm-negative-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate synthetic UCM fixture
        run: python3 tests/make_ucm_fixture.py /tmp/cm-fixture.ucm
      - name: Compile malformed-input regression suite
        run: swiftc ios/CMUCMModel.swift tests/UCMNegativeSmoke.swift -o /tmp/cm-ucm-negative
      - name: Reject corrupted UCM files
        run: /tmp/cm-ucm-negative /tmp/cm-fixture.ucm

  ucm-version2-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test UCM version 2 trailer layouts
        run: |
          swiftc ios/CMUCMModel.swift tests/UCMVersion2Smoke.swift -o /tmp/cm-ucm-v2
          /tmp/cm-ucm-v2

  ucm-thousand-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate synthetic UCM fixture
        run: python3 tests/make_ucm_fixture.py /tmp/cm-fixture.ucm
      - name: Compile and run 1000 malformed UCM cases
        run: |
          swiftc ios/CMUCMModel.swift tests/UCMThousandSmoke.swift -o /tmp/cm-ucm-thousand
          /tmp/cm-ucm-thousand /tmp/cm-fixture.ucm

  metal-uniform-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift side of Metal uniform ABI
        run: |
          swiftc -parse-as-library tests/UniformLayoutSmoke.swift -o /tmp/cm-uniform-smoke
          /tmp/cm-uniform-smoke

  material-candidate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run conservative material binding tests
        run: |
          swiftc ios/CMMaterialCandidates.swift tests/MaterialCandidatesSmoke.swift -o /tmp/cm-material-smoke
          /tmp/cm-material-smoke

  material-path-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows paths and ambiguous model bindings
        run: |
          swiftc ios/CMMaterialCandidates.swift tests/MaterialPathSmoke.swift -o /tmp/cm-material-path
          /tmp/cm-material-path

  physics-prototype-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test 1000 physics collision scenarios
        run: |
          swiftc ios/CMPhysics2D.swift tests/CMPhysicsSmoke.swift -o /tmp/cm-physics
          /tmp/cm-physics
          swiftc ios/CMPhysics2D.swift tests/CMCircleCollisionSmoke.swift -o /tmp/cm-circles
          /tmp/cm-circles
          swiftc ios/CMPhysics2D.swift tests/CMSlopeSmoke.swift -o /tmp/cm-slopes
          /tmp/cm-slopes
          swiftc ios/CMPhysics2D.swift tests/CMFrictionSmoke.swift -o /tmp/cm-friction
          /tmp/cm-friction
          swiftc ios/CMPhysics2D.swift tests/CMAngularSmoke.swift -o /tmp/cm-angular
          /tmp/cm-angular
          swiftc ios/CMPhysics2D.swift ios/CMPinJoint2D.swift tests/CMPinSmoke.swift -o /tmp/cm-pins
          /tmp/cm-pins
          swiftc ios/CMPhysics2D.swift ios/CMSpringJoint2D.swift tests/CMSpringSmoke.swift -o /tmp/cm-springs
          /tmp/cm-springs
          swiftc ios/CMPhysics2D.swift ios/CMPinJoint2D.swift ios/CMSpringJoint2D.swift tests/CMCombinedMechanicsSmoke.swift -o /tmp/cm-combined-mechanics
          /tmp/cm-combined-mechanics
          swiftc ios/CMPhysics2D.swift ios/CMSpringJoint2D.swift tests/CMSpringParametersSmoke.swift -o /tmp/cm-spring-parameters
          /tmp/cm-spring-parameters
          swiftc ios/CMPhysics2D.swift ios/CMSpringJoint2D.swift tests/CMSpringEdgeCasesSmoke.swift -o /tmp/cm-spring-edge-cases
          /tmp/cm-spring-edge-cases
          swiftc ios/CMPhysics2D.swift ios/CMPivotJoint2D.swift tests/CMPivotSmoke.swift -o /tmp/cm-pivots
          /tmp/cm-pivots

  preview-fixture-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify first-launch synthetic model
        run: |
          swiftc ios/CMUCMModel.swift ios/CMPreviewFixture.swift tests/PreviewFixtureSmoke.swift -o /tmp/cm-preview-smoke
          /tmp/cm-preview-smoke

  swift-syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swiftc --version
      - name: Parse iOS Swift source
        run: swiftc -frontend -parse ios/*.swift

  level-document-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test level document persistence
        run: |
          swiftc ios/CMPhysics2D.swift ios/CMPinJoint2D.swift ios/CMSpringJoint2D.swift ios/CMPivotJoint2D.swift ios/CMLevelDocument.swift tests/CMLevelDocumentSmoke.swift -o /tmp/cm-level-document
          /tmp/cm-level-document

  original-scene-document-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate original scene JSON with Swift
        run: |
          swiftc ios/CMOriginalSceneDocument.swift tests/OriginalSceneDocumentSmoke.swift -o /tmp/cm-original-scene
          /tmp/cm-original-scene

  ios-simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS Xcode project
        run: xcodegen generate --spec project.yml
      - name: Build unsigned iPhone Simulator app
        run: |
          xcodebuild -project CrazyMachinesIOS.xcodeproj \
            -scheme CrazyMachinesIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/cm-ios-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone simulator and launch actual application
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[v["udid"] for group in d.values() for v in group if v["name"].startswith("iPhone") and v["state"]=="Shutdown"]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID" || { echo "No available iPhone simulator"; exit 1; }
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" /tmp/cm-ios-derived/Build/Products/Debug-iphonesimulator/CrazyMachinesIOS.app
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" org.crazymachines.port
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot /tmp/cm-ios-launch.png
          test -s /tmp/cm-ios-launch.png
      - name: Upload actual simulator launch screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-launch-screenshot
          path: /tmp/cm-ios-launch.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload built simulator application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-simulator-app
          path: /tmp/cm-ios-derived/Build/Products/Debug-iphonesimulator/CrazyMachinesIOS.app
          if-no-files-found: error
          retention-days: 14
      - name: Archive simulator build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            /tmp/cm-ios-derived/Logs/Build
            /tmp/cm-ios-derived/Build/Intermediates.noindex
          if-no-files-found: warn

  ios-ui-smoke:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Run real iPhone UI navigation test
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[v["udid"] for group in d.values() for v in group if v["name"].startswith("iPhone")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID" || { echo "No available iPhone simulator"; exit 1; }
          xcodebuild -project CrazyMachinesIOS.xcodeproj -scheme CrazyMachinesIOS \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/cm-ui-derived CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath /tmp/cm-ui-tests.xcresult test
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyMachinesIOS-ui-test-results
          path: /tmp/cm-ui-tests.xcresult
          if-no-files-found: ignore
          retention-days: 14
